name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        shell: bash
        run: |
          ZIP_PATH=$(find . -type f -name 'weibo-mobile-source.zip' | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "weibo-mobile-source.zip not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "Using source archive: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: source/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weibo-task-debug-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
