name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        shell: bash
        run: |
          ZIP_PATH=$(find . -type f -name 'weibo-mobile-source.zip' | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "weibo-mobile-source.zip not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "Using source archive: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ★1 新增：还原签名密钥
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次将使用默认 debug 签名（每次构建签名都不同）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已还原，大小: $(stat -c%s "$RUNNER_TEMP/release.keystore") 字节"
          echo "--- 签名指纹（应为 46:D1:A2:...:58:35）---"
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true

      # ★2 修改：构建时注入签名参数
      - name: Build debug APK
        working-directory: source/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Read app version
        id: version
        shell: bash
        working-directory: source/android
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weibo-task-debug-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 星签 v${{ steps.version.outputs.version }}
          body: 自动构建的星签 Android 安装包
          files: source/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
