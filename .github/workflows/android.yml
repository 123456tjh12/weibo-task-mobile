# 星签 Android APK 构建
#
# ★★ 本次修改（★4）：出 **release 包**，不再出 debug 包
#
#   原因：以前写的是 `gradle assembleDebug`，所以 GitHub Release 上挂的一直是
#         app-debug.apk。它**能用**（签名是同一套，能覆盖安装，逻辑也完全一样），
#         但会让人误以为「这是个测试版」，而且包体略大、带了调试标记。
#
#   改动一共四处（必须一起改，漏一处就会拿不到文件）：
#     1) 构建任务        assembleDebug  -> assembleRelease
#     2) artifact 名称   weibo-task-debug-apk -> weibo-task-release-apk
#     3) 产物路径        apk/debug/app-debug.apk -> apk/release/app-release.apk（上传 artifact）
#     4) Release 文件    同上路径（挂到 GitHub Release 上）
#
#   ★ 另外加了 `-x lintVitalRelease`：
#     release 构建默认会跑 lintVital，一旦发现 fatal 级 lint 问题就**直接中止构建**。
#     这个项目只是自用工具，不需要卡在 lint 上，所以显式跳过这一项。
#
# 之前的修改（保留）：
#   ★1 还原签名密钥   ★2 构建时注入签名参数
#   ★3 修 "Set up Android SDK" 步骤失败
#      （android-actions/setup-android 默认要装 "tools" 包，而 Google 已把它从
#        SDK 仓库彻底移除 → 该步骤必然失败 → 后面全被跳过。
#        修法：packages 置空 + v3→v4 + continue-on-error + 自己装 SDK 包。）

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        shell: bash
        run: |
          ZIP_PATH=$(find . -type f -name 'weibo-mobile-source.zip' | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "weibo-mobile-source.zip not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "Using source archive: $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ★3：packages 置空，不再安装已被移除的 "tools" 包
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true
        with:
          packages: ''

      # ★3：自己保证 SDK 可用，不依赖上面那个第三方 action
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -u
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager: ${SDKMGR:-未找到}"
          if [ -n "$SDKMGR" ]; then
            # 接受许可协议（失败不致命，下面会打印实际可用包）
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # 只装真正需要的包（注意：不要装 tools，它已经不存在了）
            yes | "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

          # Gradle 也认这个文件，双保险
          if [ -d source/android ]; then
            echo "sdk.dir=$SDK_ROOT" > source/android/local.properties
          fi

          echo "--- platforms ---"
          ls "$SDK_ROOT/platforms" 2>/dev/null || echo "(无)"
          echo "--- build-tools ---"
          ls "$SDK_ROOT/build-tools" 2>/dev/null || echo "(无)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ★1 还原签名密钥（放在构建之前）
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次将使用默认 debug 签名（每次构建签名都不同）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已还原，大小: $(stat -c%s "$RUNNER_TEMP/release.keystore") 字节"
          echo "--- 签名指纹（应为 46:D1:A2:...:58:35）---"
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true

      # ★2 构建时注入签名参数
      # ★4 assembleDebug -> assembleRelease；并跳过 lintVitalRelease（否则 lint 问题会中止构建）
      - name: Build release APK
        working-directory: source/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -x lintVitalRelease --no-daemon

      # ★4 打印一下产物到底叫什么、在哪，避免路径猜错时只看到一句 "file not found"
      - name: Show build outputs
        shell: bash
        working-directory: source/android
        run: |
          echo "--- 所有 apk 产物 ---"
          find app/build/outputs/apk -type f -name '*.apk' 2>/dev/null || echo "(没有找到任何 apk)"

      - name: Read app version
        id: version
        shell: bash
        working-directory: source/android
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      # ★4 路径与名称都跟着改成 release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weibo-task-release-apk
          path: source/android/app/build/outputs/apk/release/app-release.apk

      # ★4 挂到 Release 上的也换成 release 包
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 星签 v${{ steps.version.outputs.version }}
          body: 自动构建的星签 Android 安装包
          files: source/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
